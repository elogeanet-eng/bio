<style>
/* ---------- Variables : palette strictement noir & blanc ---------- */
:root{--w:#fff;--k:#000;--g:#6b6b6b;--l:#e5e5e5;
--display:'Anton','Impact','Arial Narrow',sans-serif;--body:'Inter',system-ui,-apple-system,'Segoe UI',Arial,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--body);background:var(--w);color:var(--k);line-height:1.65;overflow-x:hidden;-webkit-font-smoothing:antialiased}
a{color:inherit}
:focus-visible{outline:3px solid currentColor;outline-offset:3px}
.sec{padding:clamp(72px,12vw,160px) clamp(20px,6vw,96px)}
.dark{background:var(--k);color:var(--w)}
.wrap{max-width:1200px;margin:0 auto}
.big{font-family:var(--display);text-transform:uppercase;line-height:.92;letter-spacing:-.01em;font-weight:400}
h2.big{font-size:clamp(44px,9vw,130px);margin-bottom:clamp(32px,5vw,64px);overflow-wrap:anywhere}
.tag{font-size:12px;letter-spacing:.2em;text-transform:uppercase;font-weight:700;margin-bottom:20px;display:block;color:var(--g)}
.dark .tag{color:#aaa}
/* Boutons : inversion au survol */
.btn{display:inline-block;padding:16px 34px;border:2px solid var(--k);background:var(--k);color:var(--w);border-radius:999px;font-weight:700;text-decoration:none;text-transform:uppercase;letter-spacing:.08em;font-size:13px;transition:background .25s,color .25s,transform .25s}
.btn:hover{background:var(--w);color:var(--k);transform:translateY(-3px)}
.dark .btn{background:var(--w);color:var(--k);border-color:var(--w)}
.dark .btn:hover{background:var(--k);color:var(--w)}
/* Navigation */
nav{position:fixed;top:0;left:0;right:0;z-index:50;display:flex;justify-content:space-between;align-items:center;padding:16px clamp(20px,6vw,96px);background:var(--w);border-bottom:1px solid var(--l)}
nav .logo{font-family:var(--display);font-size:22px;text-decoration:none;letter-spacing:.04em}
nav ul{display:flex;gap:28px;list-style:none}
nav ul a{font-size:12px;text-transform:uppercase;letter-spacing:.14em;font-weight:500;text-decoration:none;background:linear-gradient(currentColor,currentColor) 0 100%/0 2px no-repeat;transition:background-size .3s;padding-bottom:4px}
nav ul a:hover{background-size:100% 2px}
.menu{display:none;background:none;border:2px solid var(--k);padding:8px 14px;font:700 12px var(--body);text-transform:uppercase;cursor:pointer;color:var(--k)}
@media(max-width:860px){.menu{display:block}nav ul{display:none;position:absolute;top:100%;left:0;right:0;flex-direction:column;gap:0;background:var(--w);border-bottom:1px solid var(--k)}nav ul.open{display:flex}nav ul a{display:block;padding:18px 20px}}
/* Hero */
.hero{min-height:100vh;min-height:100svh;display:flex;flex-direction:column;justify-content:flex-end;padding:120px clamp(20px,6vw,96px) 56px}
.hero h1{font-size:clamp(52px,14.5vw,230px);margin-bottom:32px;overflow-wrap:anywhere}
.hero .row{display:flex;flex-wrap:wrap;gap:32px;justify-content:space-between;align-items:flex-end;border-top:3px solid var(--k);padding-top:28px}
.hero .sub{font-weight:700;text-transform:uppercase;letter-spacing:.12em;font-size:14px;margin-bottom:10px}
.hero p.acc{max-width:520px;font-size:clamp(18px,2vw,22px)}
/* À propos */
.about{display:grid;grid-template-columns:1fr;gap:48px}
@media(min-width:900px){.about{grid-template-columns:5fr 7fr}}
.photo{width:min(100%,300px);aspect-ratio:4/5;overflow:hidden;background:repeating-linear-gradient(45deg,#f2f2f2,#f2f2f2 12px,#e9e9e9 12px,#e9e9e9 24px);border:2px solid var(--k);display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;font-size:13px;text-transform:uppercase;letter-spacing:.12em;position:sticky;top:96px}
.photo img{width:100%;height:100%;object-fit:cover;object-position:center top;filter:grayscale(1)}
.bio p{margin-bottom:1.3em;font-size:clamp(16px,1.5vw,19px)}
.bio p:first-child{font-size:clamp(20px,2.4vw,28px);font-weight:500;line-height:1.4}
/* Frise */
.tl{list-style:none;border-left:3px solid var(--w);margin-left:8px}
.tl li{position:relative;padding:0 0 56px 32px}
.tl li:before{content:"";position:absolute;left:-11px;top:8px;width:19px;height:19px;background:var(--k);border:3px solid var(--w);border-radius:50%}
.tl li.now:before{background:var(--w)}
.tl .yr{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:#aaa;font-weight:700}
.tl h3{font-family:var(--display);font-weight:400;font-size:clamp(28px,4.5vw,54px);text-transform:uppercase;line-height:1;margin:8px 0}
.tl p{color:#ccc;max-width:640px}
/* Cartes */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:0;border:2px solid var(--k)}
.card{padding:36px 28px;border:1px solid var(--k);min-height:300px;display:flex;flex-direction:column;justify-content:space-between;transition:background .3s,color .3s;background:var(--w)}
.card:hover{background:var(--k);color:var(--w)}
.card .n{font-family:var(--display);font-size:72px;line-height:1}
.card h3{font-family:var(--display);font-weight:400;text-transform:uppercase;font-size:28px;line-height:1.05}
/* Centres d'intérêt */
.int{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px}
.pan{border:2px solid var(--k);padding:32px;display:flex;flex-direction:column;justify-content:space-between;transition:transform .3s}
.pan:hover{transform:translateY(-8px)}
.pan h3{font-family:var(--display);font-weight:400;font-size:clamp(44px,6vw,80px);text-transform:uppercase;line-height:.95;overflow-wrap:anywhere}
.pan{overflow:hidden}.pan img{width:100%;aspect-ratio:4/3;object-fit:cover;filter:grayscale(1);margin-bottom:24px;border:1px solid var(--k);transition:transform .5s}.pan:hover img{transform:scale(1.03)}
/* Vision */
.quote{font-size:clamp(34px,7vw,104px);margin-bottom:40px}
.vis p{max-width:640px;color:#ccc;font-size:18px}
/* Marquee */
.mq{overflow:hidden;background:var(--w);color:var(--k);border-block:3px solid var(--k);padding:22px 0;white-space:nowrap}
.mq div{display:inline-block;animation:mq 22s linear infinite;font-family:var(--display);text-transform:uppercase;font-size:clamp(36px,6vw,72px)}
.mq span{margin:0 28px}
@keyframes mq{to{transform:translateX(-50%)}}
/* Contact */
.ct a.big{display:block;font-size:clamp(32px,7vw,96px);border-bottom:2px solid var(--w);padding:18px 0;text-decoration:none;transition:padding-left .3s}
.ct a.big:hover{padding-left:24px}
footer{padding:28px clamp(20px,6vw,96px);font-size:12px;letter-spacing:.1em;text-transform:uppercase;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;background:var(--k);color:#aaa;border-top:1px solid #333}
/* Apparition au scroll */
.rv{opacity:0;transform:translateY(36px);transition:opacity .8s ease,transform .8s ease}
.rv.in{opacity:1;transform:none}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.rv{opacity:1;transform:none;transition:none}.mq div{animation:none}*{transition-duration:.01ms!important}}

const NAME = "Anet Kouao Franck Eloge";
const ACCROCHE = "Du code au câble : je construis la sécurité des infrastructures numériques africaines.";
const BIO = [
"Il y a des questions qui ne se posent qu'une fois qu'on a compris comment les choses tiennent ensemble : qui protège ce que nous construisons, et comment ? Je cherche des réponses depuis le jour où j'ai compris que derrière chaque écran se cache un monde de câbles, de protocoles et de décisions invisibles.",
"Je suis Anet Kouao Franck Eloge, Ivoirien, célibataire et sans enfant, actuellement étudiant en Master 1 Expert Réseau Infrastructure et Sécurité (ERIS) à l'ESATIC, à Abidjan. Ce chemin, je ne l'ai pas tracé d'un seul trait, mais je suis fier de l'avoir construit étape par étape.",
"Tout a commencé au Lycée Moderne de Zuénoula, où j'ai obtenu mon baccalauréat série D en 2021. Cette série m'a appris à observer, à raisonner avec méthode et à ne jamais accepter une réponse sans en comprendre la mécanique. Cet esprit scientifique m'a naturellement conduit vers l'informatique. En 2022, j'ai rejoint l'ITES II Plateaux, à Abidjan, pour le BTS Réseau Informatique et Télécommunication. J'y ai découvert comment l'information circule, de la configuration d'un équipement à l'architecture d'un réseau. J'ai été déclaré admissible : une étape exigeante, que je regarde sans détour comme formatrice, parce qu'elle m'a appris la persévérance et la valeur d'un cap tenu quand le chemin se complique.",
"Pour comprendre l'autre moitié du numérique, j'ai ensuite choisi la Licence Développement d'Applications et Systèmes d'Information (DASI) à l'ESATIC, en 2025-2026. J'y ai appris à concevoir des applications et à structurer l'information d'une organisation. Ce détour par le code est devenu un atout : celui qui sait comment une application est écrite comprend mieux où elle peut céder, et celui qui connaît le réseau sait par où on l'atteint. Réunir ces deux regards, c'est se donner les moyens de penser la sécurité de bout en bout, de la ligne de code jusqu'au câble.",
"Aujourd'hui, le Master 1 ERIS, entamé en 2026 et toujours en cours, me forme à l'infrastructure et à la cybersécurité. Je ne prétends pas avoir tout appris ; je me sais en chemin, et cette humilité est ma meilleure alliée. La curiosité me pousse à creuser, la rigueur à vérifier, le partage à transmettre ce que je comprends à ceux qui apprennent avec moi.",
"Hors des salles de cours, je suis le même. Le basket-ball m'a enseigné l'esprit d'équipe et la discipline : on ne gagne pas seul, et on ne progresse pas sans répétition. La musique nourrit ma créativité et mon écoute, deux qualités précieuses quand il faut comprendre un besoin avant d'y répondre. La photographie, enfin, aiguise mon sens du détail et mon regard attentif, celui qui remarque ce qui cloche avant que cela ne devienne un problème.",
"Mon ambition est claire : contribuer à la sécurisation et au développement des infrastructures numériques de la Côte d'Ivoire et, plus largement, de l'Afrique. Nos pays se connectent à grande vitesse ; il leur faut des fondations solides et des professionnels capables de les défendre. Je veux en faire partie, apprendre auprès de ceux qui ont de l'expérience et, un jour, transmettre à mon tour.",
"Je ne cherche pas seulement un stage ou un premier poste : je cherche l'endroit où se dépasser aura un sens. Le meilleur reste à bâtir, et je compte bien en poser les premières fondations."
];

/* ================= COMPOSANTS ================= */
/* Apparition progressive au scroll */
function Reveal({ children, as: Tag = "div", delay = 0, className = "" }) {
  const ref = useRef(null);
  useEffect(() => {
    const el = ref.current;
    if (!("IntersectionObserver" in window)) { el.classList.add("in"); return; }
    const io = new IntersectionObserver(([e]) => { if (e.isIntersecting) { el.classList.add("in"); io.disconnect(); } }, { threshold: .12 });
    io.observe(el);
    return () => io.disconnect();
  }, []);
  return <Tag ref={ref} className={"rv " + className} style={{ transitionDelay: delay + "ms" }}>{children}</Tag>;
}

function Section({ id, dark, tag, title, children }) {
  return (
    <section id={id} className={"sec" + (dark ? " dark" : "")} aria-labelledby={id + "-t"}>
      <div className="wrap">
        <Reveal><span className="tag">{tag}</span><h2 id={id + "-t"} className="big">{title}</h2></Reveal>
        {children}
      </div>
    </section>
  );
}

function Navbar() {
  const [open, setOpen] = useState(false);
  return (
    <nav aria-label="Navigation principale">
      <a className="logo" href="#top">A.K.F.E</a>
      <button className="menu" aria-expanded={open} aria-controls="menu" onClick={() => setOpen(!open)}>Menu</button>
      <ul id="menu" className={open ? "open" : ""}>
        {NAV.map(([id, l]) => <li key={id}><a href={"#" + id} onClick={() => setOpen(false)}>{l}</a></li>)}
      </ul>
    </nav>
  );
}

function Hero() {
  return (
    <header id="top" className="hero">
      <Reveal as="h1" className="big">{NAME}</Reveal>
      <Reveal className="row" delay={150}>
        <div>
          <p className="sub">Étudiant en Master 1 ERIS · ESATIC</p>
          <p className="acc">{ACCROCHE}</p>
        </div>
        <a className="btn" href="#a-propos">Découvrir mon parcours ↓</a>
      </Reveal>
    </header>
  );
}

function About() {
  return (
    <Section id="a-propos" tag="01 — À propos" title="Mon histoire">
      <div className="about">
        <Reveal className="photo">
          {PHOTO ? <img src={PHOTO} alt={"Portrait de " + NAME} /> : <span role="img" aria-label="Emplacement de la photo de profil">[ Votre photo ici ]</span>}
        </Reveal>
        <div className="bio">{BIO.map((p, i) => <Reveal as="p" key={i}>{p}</Reveal>)}</div>
      </div>
    </Section>
  );
}

function Timeline() {
  return (
    <Section id="parcours" dark tag="02 — Parcours" title="Étape par étape">
      <ol className="tl">
        {PARCOURS.map(([yr, t, d, now], i) => (
          <Reveal as="li" key={t} delay={i * 80} className={now ? "now" : ""}>
            <span className="yr">{yr}</span><h3>{t}</h3><p>{d}</p>
          </Reveal>
        ))}
      </ol>
    </Section>
  );
}

function Skills() {
  return (
    <Section id="competences" tag="03 — Compétences" title="Domaines">
      <div className="grid">
        {COMP.map((c, i) => (
          <Reveal key={c} delay={i * 80} className="card"><span className="n">0{i + 1}</span><h3>{c}</h3></Reveal>
        ))}
      </div>
    </Section>
  );
}

function Interests() {
  return (
    <Section id="interets" tag="04 — Centres d'intérêt" title="Hors des cours">
      <div className="int">
        {INTERETS.map(([t, d, src], i) => (
          <Reveal key={t} delay={i * 100} className="pan">
            <img src={src} alt={"Illustration : " + t} loading="lazy" />
            <div><h3>{t}</h3><p>{d}</p></div>
          </Reveal>
        ))}
      </div>
    </Section>
  );
}

function Vision() {
  return (
    <section id="vision" className="sec dark vis" aria-labelledby="vision-t">
      <div className="wrap">
        <Reveal><span className="tag">05 — Vision</span>
          <h2 id="vision-t" className="big quote">Sécuriser les fondations numériques de l'Afrique.</h2>
          <p>Contribuer à la sécurisation et au développement des infrastructures numériques de la Côte d'Ivoire et du continent : des fondations solides, et des professionnels capables de les défendre.</p>
        </Reveal>
      </div>
    </section>
  );
}

function Marquee() {
  const items = [...VALEURS, ...VALEURS, ...VALEURS, ...VALEURS];
  return (
    <div className="mq" aria-label={"Valeurs : " + VALEURS.join(", ")}>
      <div aria-hidden="true">{items.map((v, i) => <span key={i}>{v} ✦</span>)}</div>
    </div>
  );
}

function Contact() {
  return (
    <section id="contact" className="sec dark ct" aria-labelledby="ct-t">
      <div className="wrap">
        <Reveal><span className="tag">06 — Contact</span><h2 id="ct-t" className="big">Travaillons ensemble</h2></Reveal>
        {CONTACTS.map(([l, href, ph]) => <Reveal key={l}><a className="big" href={href}>{l} → <small style={{ fontSize: ".4em", opacity: .6 }}>{ph}</small></a></Reveal>)}
      </div>
    </section>
  );
}

function Footer() {
  return <footer><span>© {new Date().getFullYear()} {NAME}</span><span>Abidjan, Côte d'Ivoire</span></footer>;
}

function App() {
  return (<><Navbar /><main><Hero /><About /><Timeline /><Skills /><Interests /><Vision /><Marquee /><Contact /></main><Footer /></>);
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
